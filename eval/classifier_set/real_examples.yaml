# Recall classifier eval set — real cases extracted from real conversation history.
# 76 examples, IDs ex_001-ex_076. 38 marked [HARD CASE].
#   ex_001-ex_046 (batch 1): A/B/C cognitive-architecture, agent-modeling, existence-proof,
#                            and Recall-design sessions.
#   ex_047-ex_076 (batch 2): binding-problem/ant-colony, novelty-assessment-2, existence-proof,
#                            and Recall-status sessions.
# This is the single canonical real set. Phase 2 / follow-up runs in eval/PHASE2_FINDINGS.md and
# eval/PHASE2_FOLLOWUP_FINDINGS.md were on batch 1 only (46 cases); see eval/PHASE2_V2_BASELINE.md
# for the 76-case baseline.

---
id: ex_001
existing_facts:
- id: f_abc_01
  valid_at: '2026-08-20'
  scope: cognitive-architecture
  content: 'The framework has three components: A (hierarchical embedding/dimensionality reduction), B
    (recurrent workspace), and C (basal ganglia selection). A and B are separate boxes.'
new_capture:
  id: c001
  captured_at: '2026-08-27'
  content: A and B are not truly separate boxes. They are one cortical mechanism along a continuum — the
    same canonical dimensionality-reduction operation, running from state-embedding at the A end to dynamics-compression
    at the B end. C remains genuinely separate.
expected_classification: update
expected_conflicting_fact_id: f_abc_01
notes: The old claim was held and is now superseded by a better-reasoned structural revision. Not a contradiction
  in the sense of irreconcilable conflict — the earlier framing was a useful scaffold that got refined.

---
id: ex_002
existing_facts:
- id: f_abc_02
  valid_at: '2026-08-27'
  scope: cognitive-architecture
  content: A and B are one cortical mechanism along a continuum, not two boxes.
new_capture:
  id: c002
  captured_at: '2026-08-27'
  content: The gradient isn't perfectly smooth. There are genuine seams within the cortical continuum
    — the dissociation-defined sub-regions are real breakages, and the hippocampal system has genuinely
    distinct architecture. The continuum has joints.
expected_classification: context_dependent_both
expected_conflicting_fact_id: f_abc_02
notes: Both hold. 'One mechanism along a continuum' is true at the level of cortical operation; 'there
  are real structural discontinuities' is true at the level of local architecture. Different scopes, not
  competing claims.  [HARD CASE]

