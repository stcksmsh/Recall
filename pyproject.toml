[project]
name = "recall"
version = "0.1.0"
description = "A self-maintaining AI memory system: plaintext-first, recoverable by construction."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
recall = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.capture", "src.consolidate", "src.retrieve", "src.inject", "src.verify", "src.index"]
