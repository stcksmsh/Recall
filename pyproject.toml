[project]
name = "recall"
version = "0.1.0"
description = "A self-maintaining AI memory system: plaintext-first, recoverable by construction."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Eval-only. `verify-nli`: the Phase 6 NLI stage (evaluated, not shipped — see
# eval/PHASE6_FINDINGS.md). `local-eval`: local GGUF classifier comparison in eval/run_eval.py.
verify-nli = [
    "torch>=2.2",
    "transformers>=4.40",
]
local-eval = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.24",
]

[project.scripts]
recall = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.capture", "src.consolidate", "src.retrieve", "src.inject", "src.verify", "src.index", "src.review_tui"]
